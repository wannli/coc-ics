<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DGACM Calendar ICS</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar" aria-label="Calendar controls">
        <div>
          <h1>DGACM Calendar ICS</h1>
          <p>UN Calendar "By Year" page to calendar file.</p>
        </div>
        <div class="actions">
          <button id="fetchButton" type="button">Fetch UN year page</button>
          <button id="sampleButton" type="button" class="secondary">Load sample</button>
          <button id="exportButton" type="button">Export ICS</button>
        </div>
      </section>

      <section class="filters" aria-label="Filters">
        <label>
          Search
          <input id="queryInput" type="search" value="" autocomplete="off">
        </label>
        <label>
          Year
          <input id="yearInput" type="text" inputmode="numeric" value="" placeholder="All years">
        </label>
        <label class="check">
          <input id="committeeInput" type="checkbox">
          Committee / CoC only
        </label>
      </section>

      <section class="status" aria-live="polite">
        <strong id="summaryText">No page loaded yet.</strong>
        <span id="sourceText"></span>
      </section>

      <section class="workspace">
        <label class="html-panel">
          Year-page HTML
          <textarea id="htmlInput" spellcheck="false" placeholder="Paste the rendered HTML from https://www.un.org/calendar/en/year here."></textarea>
        </label>

        <div class="results-panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Meeting title</th>
                  <th>Venue</th>
                  <th>From</th>
                  <th>To</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
